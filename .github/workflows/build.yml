name: Build immutable CI runner

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ci-runner
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'lilch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUNNER_IMAGE: ghcr.io/lilch/cvfast-ci-runner:${{ github.sha }}
      ALINUX_BASE_IMAGE: alibaba-cloud-linux-3-registry.cn-hangzhou.cr.aliyuncs.com/alinux3/alinux3@sha256:f89f2535f5fa263d951ac91c34bd1b7114ea85e0ee9b54c61832f09ed4e6f314
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and smoke-test native AMD64 image
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --build-arg "ALINUX_BASE_IMAGE=$ALINUX_BASE_IMAGE" \
            --tag "$RUNNER_IMAGE" .
          docker run --rm --network none --platform linux/amd64 "$RUNNER_IMAGE" \
            bash -ceu '
              uv --version | grep -Fx "uv 0.10.7"
              python3.11 -c "import ssl, sys; assert sys.version_info[:2] == (3, 11); assert ssl.OPENSSL_VERSION"
              postgres --version | grep -Fx "postgres (PostgreSQL) 16.11"
              redis-server --version | grep -F "v=7.2.16"
              soffice --version >/dev/null
              fc-list | grep -F "Liberation Sans" >/dev/null
              fc-list | grep -F "Noto Sans CJK" >/dev/null
              command -v initdb pg_ctl psql runuser git bash jq gcc g++ make >/dev/null
            '
      - name: Push and prove anonymous immutable pull
        run: |
          set -euo pipefail
          docker push "$RUNNER_IMAGE"
          # shellcheck disable=SC2016
          runner_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$RUNNER_IMAGE")"
          [[ "$runner_digest" =~ ^ghcr\.io/lilch/cvfast-ci-runner@sha256:[0-9a-f]{64}$ ]]
          docker logout ghcr.io
          docker manifest inspect "$runner_digest" >/dev/null
          printf 'RUNNER_IMAGE=%s\n' "$runner_digest" | tee runner-image-digest.txt
          printf "### Immutable runner\n\n\`%s\`\n" "$runner_digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable digest evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-image-digest
          path: runner-image-digest.txt
          retention-days: 90
          if-no-files-found: error
